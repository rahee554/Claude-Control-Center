name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit -- --reporter spec
        id: unit
        continue-on-error: true
      - name: Report failing tests
        if: steps.unit.outcome == 'failure'
        shell: bash
        run: |
          npx mocha "out/test/unit/**/*.test.js" --reporter json > mocha.json || true
          node scripts/ci/report-failures.js mocha.json
          exit 1
      # Optional e2e smoke test (downloads VS Code); Linux needs a virtual display.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
        continue-on-error: true
