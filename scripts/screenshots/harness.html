<script>
// Stub of the VS Code webview API.
window.acquireVsCodeApi = () => ({ getState: () => undefined, setState: () => undefined, postMessage: () => undefined });
</script>
<script src=".gen/gen.js"></script><script src="mock.js"></script>
<script src="../../media/shell.js"></script><script src="../../media/dashboard.js"></script><script src="../../media/agents.js"></script><script src="../../media/checkpoints.js"></script>
<script>
const q = new URLSearchParams(location.search), tab = q.get('tab') || 'activity';
document.body.style.width = (q.get('w') || 420) + 'px';
setTimeout(() => {
  const post = (m) => window.postMessage(m, '*');
  post({ tab: 'shell', type: 'init', active: tab, badges: window.MOCK.badges });
  post({ tab, type: 'state', state: window.MOCK[tab] });
  setTimeout(() => { const h = document.querySelector('.turn-h'); if (h && tab === 'activity') h.click(); }, 100);
}, 100);
</script></body></html>
